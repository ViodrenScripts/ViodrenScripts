<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ViodrenScripts</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b12;color:#fff;font-family:Arial,sans-serif}
header{padding:32px 20px;text-align:center;background:linear-gradient(135deg,#17102b,#0b0b12)}
h1{margin:0;font-size:38px}h1 span{color:#8b5cf6}.sub{color:#aaa;margin:8px 0 22px}
.search{width:min(650px,100%);padding:14px 16px;border-radius:12px;border:1px solid #303044;background:#151522;color:#fff;outline:none}
.tabs{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}.tab{border:1px solid #383844;border-radius:10px;padding:10px 16px;background:#151522;color:#aaa;font-weight:bold;cursor:pointer}.tab.active{background:#8754dc;color:#fff}
main{width:min(1000px,92%);margin:30px auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.card{background:#151522;border:1px solid #292941;border-radius:16px;padding:20px}.card h2{margin-top:0}
.tag{display:inline-block;color:#b99cff;background:#251a3e;border-radius:20px;padding:5px 9px;font-size:12px}
button{border:0;border-radius:10px;padding:11px 15px;background:#8b5cf6;color:#fff;font-weight:bold;cursor:pointer}
button:hover{background:#7549dc}.code{display:none;margin-top:14px;background:#08080d;border-radius:10px;padding:14px;white-space:pre-wrap;overflow:auto;color:#ddd;font:13px Consolas,monospace}
.msg{text-align:center;color:#999;margin:30px}.copy{margin-top:10px}.card-image{display:block;width:100%;height:210px;object-fit:cover;border-radius:12px;margin-top:18px;background:#211a30}.image-note{font-size:11px;color:#8f879e;margin:8px 0 0;text-align:center}
footer{text-align:center;color:#8f879e;padding:30px}.visit-counter{margin-top:12px;display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border:1px solid #38284f;border-radius:12px;background:#151522;color:#c7b2f5;font-size:14px}.visit-counter strong{color:#fff;font-size:17px}
</style>
</head>
<body>
<header>
<h1>Viodren<span>Scripts</span></h1>
<div class="sub">Roblox Scripts • Atualizado pelo Viodren</div>
<input class="search" id="search" placeholder="🔎 Procurar um script...">
<div class="tabs"><button class="tab active" data-game="Ride a Pet">🐾 Ride a Pet</button><button class="tab" data-game="Steal a Egg">🥚 Steal a Egg</button></div>
</header>
<main>
<div class="grid" id="scripts"></div>
<div class="msg" id="empty" style="display:none">Nenhum script encontrado.</div>
</main>
<footer>ViodrenScripts<br><div class="visit-counter"><span>👁️ Visitas únicas:</span> <strong id="visitCount">A carregar...</strong></div><div style="font-size:11px;color:#6f687d;margin-top:8px">Cada navegador é contado uma vez neste dispositivo.</div></footer>
<script>
/*
  Contador partilhado: incrementa apenas na primeira visita deste navegador.
  O registo local evita contar novamente quando a pessoa atualiza a página.
  Limitação: outro navegador/dispositivo ou dados apagados podem contar de novo.
*/
(async function loadVisitCounter(){
  const output = document.getElementById("visitCount");
  const storageKey = "viodrenscripts_visit_counted_v1";
  const apiBase = "https://abacus.jasoncameron.dev";
  const namespace = "viodrenscripts";
  const counterKey = "visitas-unicas-v1";

  try {
    if (!localStorage.getItem(storageKey)) {
      const hit = await fetch(`${apiBase}/hit/${namespace}/${counterKey}`);
      if (!hit.ok) throw new Error("Não foi possível registar a visita.");
      localStorage.setItem(storageKey, "1");
    }
    const response = await fetch(`${apiBase}/get/${namespace}/${counterKey}`);
    if (!response.ok) throw new Error("Não foi possível ler o contador.");
    const data = await response.json();
    const total = Number(data.value);
    if (!Number.isFinite(total)) throw new Error("Resposta inválida do contador.");
    output.textContent = total.toLocaleString("pt-PT");
  } catch (error) {
    output.textContent = "Indisponível";
    console.error("Erro no contador de visitas:", error);
  }
})();
</script>

<script>
/* ===== ADICIONA OS TEUS SCRIPTS AQUI ===== */
const scripts = [
  {
    name:"Meu primeiro script (Ride a Pet)",
    game:"Ride a Pet",
    description:"Script para Ride a Pet (𝘼𝙏𝙐𝘼𝙇𝙄𝙕𝘼𝘾̧𝘼̃𝙊 𝟮) - 𝙉𝙚𝙘𝙚𝙨𝙨𝙞𝙩𝙖 𝙙𝙚 𝙆𝙀𝙔 (𝘼 𝙆𝙀𝙔 𝙚𝙨𝙩𝙖́ 𝙣𝙤𝙨 𝙑𝙄́𝘿𝙀𝙊𝙎 𝙖𝙣𝙩𝙚𝙧𝙞𝙤𝙧𝙚𝙨) - (𝙆𝙀𝙔 𝙍𝙀𝙐𝙏𝙄𝙇𝙄𝙕𝘼́𝙑𝙀𝙇!!!!!!).",
    code:`loadstring(game:HttpGet("https://pastebin.com/raw/ST7xYxpu"))()`,
    image:"https://github.com/ViodrenScripts/ViodrenScripts/blob/main/v%C3%ADd%201.png?raw=true"
  },

  {
    name:"(ATUALIZADO) Ride a Pet",
    game:"Ride a Pet",
    description:"(ATUALIZADO) Script para Ride a Pet depois da nova atualização do jogo (𝘼𝙏𝙐𝘼𝙇𝙄𝙕𝘼𝘾̧𝘼̃𝙊 𝟯) - 𝙉𝙊 𝙆𝙀𝙔!!!!.",
    code:`loadstring(game:HttpGet("https://raw.githubusercontent.com/MUshihara/Serenity-hub/main/loader.lua"))()`,
    image:"https://github.com/ViodrenScripts/ViodrenScripts/blob/main/v%C3%ADdeo%202.png?raw=true"
  },

  {
    name:"SCRIPT Steal a Egg",
    game:"Steal a Egg",
    description:"SCRIPT para Roube um Ovo (Steal a Egg) - NO KEY!!!.",
    code:`loadstring(game:HttpGet("https://gist.githubusercontent.com/sourceshubs/1737c14cdba5c6fb472a995d555a50f1/raw/SourcesHubInstantStealNew"))()`,
    image:"https://github.com/ViodrenScripts/ViodrenScripts/blob/main/4444.png?raw=true"
  },

  {
    name:"[🎃EVENT] [ATUALIZADO] Ride A Pet Script",
    game:"Ride a Pet",
    description:"[🎃EVENT] [ATUALIZADO] Ride A Pet Script - NO KEY!!! - (𝘼𝙏𝙐𝘼𝙇𝙄𝙕𝘼𝘾̧𝘼̃𝙊 𝟰 - 𝙃𝘼𝙇𝙊𝙒𝙀𝙀𝙉 🎃).",
    code:`loadstring(game:HttpGet("https://scriptblox.com/raw/Ride-A-Pet-Lumin-Hub-or-Keyless-228988"))()`,
    image:"https://github.com/ViodrenScripts/ViodrenScripts/blob/main/IMXV5yGILlqQ0.png?raw=true"
  }
];
const box=document.getElementById("scripts"), search=document.getElementById("search"), empty=document.getElementById("empty");
let activeGame="Ride a Pet";
function render(){
 const q=search.value.toLowerCase();
 box.innerHTML="";
 const list=scripts.filter(s=>s.game===activeGame && (s.name+" "+s.game+" "+s.description).toLowerCase().includes(q));
 empty.style.display=list.length?"none":"block";
 list.forEach((s)=>{
   const i=scripts.indexOf(s);
   const c=document.createElement("article"); c.className="card";
   c.innerHTML=`<span class="tag">${s.game}</span><h2>${s.name}</h2><p>${s.description}</p>
   <button class="show" type="button">📜 Mostrar Script</button>
   <button class="copy" type="button">📋 Copiar Script</button>
   <div class="code" id="code${i}"></div>`;
   const codeEl=c.querySelector(".code");
   codeEl.textContent=s.code;
   const showBtn=c.querySelector(".show");
   showBtn.onclick=()=>{
     const opening=codeEl.style.display!=="block";
     codeEl.style.display=opening?"block":"none";
     showBtn.textContent=opening?"🙈 Esconder Script":"📜 Mostrar Script";
   };
   const copyBtn=c.querySelector(".copy");
   copyBtn.onclick=async()=>{
     try {
       await navigator.clipboard.writeText(s.code);
       copyBtn.textContent="✅ Copiado!";
       setTimeout(()=>copyBtn.textContent="📋 Copiar Script",1500);
     } catch(error) {
       codeEl.style.display="block";
       showBtn.textContent="🙈 Esconder Script";
       alert("Não foi possível copiar automaticamente. Seleciona o código mostrado e copia-o.");
     }
   };
   const img=document.createElement("img");
   img.className="card-image"; img.src=s.image; img.alt="Imagem de "+s.game;
   img.onerror=()=>{img.style.display="none";};
   c.append(img);
   box.appendChild(c);
 });
}
search.addEventListener("input",render);

document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click",()=>{
    activeGame=tab.dataset.game;
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    search.value="";
    render();
  });
});

render();
</script>
</body>
</html>
